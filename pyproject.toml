[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiccsa-2024-battery-soh"
version = "0.1.0"
description = "CNN–WNN–WLSTM with temporal attention for NASA battery SOH experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
